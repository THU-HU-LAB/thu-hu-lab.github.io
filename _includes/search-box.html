<div class="search-box">
  <input
    type="text"
    class="search-input"
    oninput="onSearchInput(this)"
    placeholder="{{ "search_placeholder" | t: page.locale }}"
    aria-label="{{ "search_placeholder" | t: page.locale }}"
  />
  <button
    disabled
    data-tooltip="{{ "clear_search" | t: page.locale }}"
    aria-label="{{ "clear_search" | t: page.locale }}"
    onclick="onSearchClear()"
  >
    {% include icon.html icon="fa-solid fa-magnifying-glass" %}
  </button>
</div>
